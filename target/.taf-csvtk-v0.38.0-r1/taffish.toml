[package]
name = "csvtk"
kind = "tool"
version = "0.38.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/csvtk"

[command]
name = "taf-csvtk"

[runtime]
pipe = true
command_mode = true

[container]
image = "ghcr.io/taffish/csvtk:0.38.0-r1"
dockerfile = "docker/Dockerfile"
build_platforms = "linux/amd64,linux/arm64"

[meta]
domain = "bio"
categories = ["table-processing", "csv", "tsv", "data-wrangling", "reporting"]
keywords = ["csvtk", "CSV", "TSV", "xlsx", "JSON", "Markdown", "join", "filter", "summary", "plot", "compression"]
description = "csvtk command-line toolkit for reproducible CSV/TSV table processing."

[upstream]
name = "csvtk"
type = "github"
repo = "shenwei356/csvtk"
homepage = "https://bioinf.shenwei.me/csvtk/"
manual = "https://bioinf.shenwei.me/csvtk/usage/"
release_url = "https://github.com/shenwei356/csvtk/releases/tag/v0.38.0"
downloads = "https://github.com/shenwei356/csvtk/releases/download/v0.38.0/csvtk_linux_amd64.tar.gz; https://github.com/shenwei356/csvtk/releases/download/v0.38.0/csvtk_linux_arm64.tar.gz"
version = "0.38.0"
license = "MIT"
citation = "No dedicated csvtk paper was found in the upstream README; cite the upstream project and version."
watch = "tags"
strip_prefix = "v"

[smoke]
backend = "docker"
timeout = 120
exist = ["csvtk", "sh", "grep", "ldd", "mktemp", "cmp", "tail", "od", "tr", "head", "find", "wc", "rm"]
test = ["sh /opt/csvtk/share/smoke.sh identity", "sh /opt/csvtk/share/smoke.sh tables", "sh /opt/csvtk/share/smoke.sh formats", "sh /opt/csvtk/share/smoke.sh joins", "sh /opt/csvtk/share/smoke.sh xlsx", "sh /opt/csvtk/share/smoke.sh reshape", "sh /opt/csvtk/share/smoke.sh changes", "sh /opt/csvtk/share/smoke.sh graphics", "sh /opt/csvtk/share/smoke.sh html"]
